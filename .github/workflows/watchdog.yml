# Backstop for the agent's schedule. GitHub cron is best-effort, so between the agent's :02/:32 slots this
# checks whether a slot was missed while the market is open and, if so, dispatches agent.yml itself.
# Costs about one runner-minute per tick and never calls the brain.
name: watchdog
on:
  schedule:
    - cron: "47 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Dispatch a check now even if one ran recently (tests the wiring)"
        type: boolean
        default: false
permissions: { actions: write, contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: dispatch a check if one was missed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          # Decisions are made inside the tick job now (agent/run.py --if-due), so dispatching
          # agent.yml from here only queued a run that the next tick promptly cancelled - which is
          # exactly what happened all morning on 2026-09-10. This is now a REPORTER: it says
          # whether a check is overdue and starts the chain if it has stopped entirely.
          python3 -m agent.watchdog --dry-run || true
          if ! gh run list -R "$GITHUB_REPOSITORY" -w tick.yml -L 3                  --json status -q '[.[] | select(.status=="in_progress" or .status=="queued")] | length'                | grep -qv '^0$'; then
            echo "the chain has stopped; restarting it"
            gh workflow run tick.yml --ref main -R "$GITHUB_REPOSITORY"
          else
            echo "chain is alive; nothing to do"
          fi
