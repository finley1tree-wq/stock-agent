# Watches the market between decisions: fires standing orders and refreshes the dashboard, and
# never calls the model. GitHub's cron floor is 5 minutes, so each job does four passes a minute
# apart and exits before the next one starts - reaction time is about a minute, not half an hour.
# The repo is public, so runner minutes are free; the real limit is site deploys, which is why a
# tick only publishes when something changed (see PUBLISH_EVERY_S in run.py).
name: tick
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"             # every 5 min; each job then watches minute-by-minute inside
  workflow_dispatch:
concurrency:
  group: stock-agent          # shares the agent's lane: a tick never runs beside a decision
  cancel-in-progress: false
permissions: { contents: write, actions: write }
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m agent.run --tick --loop 4 --interval 60
        env:
          BROKER: ${{ secrets.BROKER }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
      - name: commit results
        if: always()
        run: |
          git config user.name finley1tree-wq
          git config user.email 284499650+finley1tree-wq@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "tick $(date -u +%FT%H:%MZ)"
          # GitHub occasionally rejects a push with a server-side "fatal error in commit_refs",
          # which on 2026-09-08 threw away a whole check's work. Retry before giving up.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash || true
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            echo "push attempt $i failed, retrying"; sleep $((i * 5))
          done
          echo "could not push after 5 attempts"; exit 1

      # GitHub's scheduler fired ZERO times on 2026-09-09 and the agent sat out three hours of an
      # open market. So the chain does not depend on it: while the market is open each tick starts
      # the next one itself. Cron and the watchdog are now only ways to START the chain, not to
      # sustain it. The market-hours test below is what stops it running forever.
      - name: keep the chain alive
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          hour=$(date -u +%-H); dow=$(date -u +%u)
          if [ "$dow" -gt 5 ] || [ "$hour" -lt 13 ] || [ "$hour" -gt 20 ]; then
            echo "outside the session window; chain ends"; exit 0
          fi
          if python -c "
          import sys
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          from agent.broker_sim import is_trading_day, close_time
          n = datetime.now(ZoneInfo('America/New_York'))
          sys.exit(0 if (is_trading_day(n.date()) and time(9,30) <= n.time() < close_time(n.date())) else 1)
          "; then
            gh workflow run tick.yml --ref main -R "$GITHUB_REPOSITORY" && echo "next tick queued"
            # A decision must not depend on cron either. The watchdog already knows when one is
            # overdue and dispatches it, so the tick chain carries the whole schedule on its back.
            python -m agent.watchdog || echo "watchdog check failed, continuing"
          else
            echo "market closed; chain ends"
          fi
