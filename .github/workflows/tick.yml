# Watches the market between decisions: fires standing orders and refreshes the dashboard, and
# never calls the model. GitHub's cron floor is 5 minutes, so each job does four passes a minute
# apart and exits before the next one starts - reaction time is about a minute, not half an hour.
# The repo is public, so runner minutes are free; the real limit is site deploys, which is why a
# tick only publishes when something changed (see PUBLISH_EVERY_S in run.py).
name: tick
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"             # every 5 min; each job then watches minute-by-minute inside
  workflow_dispatch:
concurrency:
  group: stock-agent          # shares the agent's lane: a tick never runs beside a decision
  cancel-in-progress: false
permissions: { contents: write, actions: write }
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      # One job does both: watch for standing orders, then think if a decision is due. Splitting
      # these across two workflows meant they fought over the single-writer concurrency lane and
      # a queued tick kept cancelling a pending decision outright.
      - run: python -m agent.run --tick --loop 4 --interval 60
        env: &agent_env
          BROKER: ${{ secrets.BROKER }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
      - name: think if a decision is due
        run: python -m agent.run --if-due 30
        env: *agent_env
      - name: commit results
        if: always()
        run: |
          git config user.name finley1tree-wq
          git config user.email 284499650+finley1tree-wq@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "tick $(date -u +%FT%H:%MZ)"
          # Two separate failures seen in production, both handled here.
          # 1. GitHub rejected a push with a server-side "fatal error in commit_refs" (2026-09-08)
          #    and threw the whole check away. A transient rejection is retried.
          # 2. A rebase hit a conflict, `|| true` swallowed it, and the runner was left mid-rebase
          #    on no branch, so everything after failed (2026-09-09). A conflict means someone else
          #    pushed while this run was computing, so this run's output is based on stale state:
          #    the safe move is to abort cleanly and let the next run redo the work from the new
          #    base, never to force a half-merged ledger through.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash; then
              if git push; then echo "pushed on attempt $i"; exit 0; fi
              echo "push attempt $i rejected, retrying"; sleep $((i * 5))
            else
              git rebase --abort || true
              echo "the branch moved while this run was working; dropping this run's output so the next one recomputes from fresh state"
              exit 0
            fi
          done
          echo "could not push after 5 attempts"; exit 1

      # GitHub's scheduler fired ZERO times on 2026-09-09 and the agent sat out three hours of an
      # open market. So the chain does not depend on it: while the market is open each tick starts
      # the next one itself. Cron and the watchdog are now only ways to START the chain, not to
      # sustain it. The market-hours test below is what stops it running forever.
      - name: keep the chain alive
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The chain used to stop at the closing bell, which meant something had to restart it in
          # the morning - and GitHub's cron never once did. The agent missed the first three hours
          # of trading on three separate days waiting for a scheduler that does not come.
          #
          # So the chain no longer stops. Outside market hours each pass sleeps ten minutes and
          # then hands on, which costs a few runner-minutes an hour on a public repo and means the
          # chain is already awake and ticking when the opening bell goes. Nothing has to start it
          # because nothing ever stopped it.
          if python -c "
          import sys
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          from agent.broker_sim import is_trading_day, close_time
          n = datetime.now(ZoneInfo('America/New_York'))
          sys.exit(0 if (is_trading_day(n.date()) and time(9,30) <= n.time() < close_time(n.date())) else 1)
          "; then
            # A decision must not depend on cron either, so the chain carries it: the watchdog
            # knows when one is overdue and dispatches it.
            #
            # Order matters. Ticks and decisions share a concurrency lane, and GitHub keeps only
            # ONE pending run in a lane - queueing a new one cancels the waiting one. Queuing a
            # tick while a decision was waiting cancelled the decision outright (seen at 17:05).
            # So when a decision is dispatched, this pass does NOT queue a tick; the decision run
            # restarts the chain when it finishes.
            # Yield the lane to any decision that is waiting or running. Ticks and decisions share
            # one concurrency group (deliberately - it is what guarantees a single writer on the
            # ledger), and a lane holds only ONE pending run, so queueing a tick behind a waiting
            # decision cancels it outright. Every decision dispatched on 2026-09-10 died that way.
            waiting=$(gh run list -R "$GITHUB_REPOSITORY" -w agent.yml -L 5 \
                        --json status -q '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="pending")] | length' 2>/dev/null || echo 0)
            if [ "${waiting:-0}" != "0" ]; then
              echo "a decision is queued or running; staying out of the lane"
            else
              gh workflow run tick.yml --ref main -R "$GITHUB_REPOSITORY" && echo "next tick queued"
            fi
            # NOTE: the watchdog must NOT dispatch agent.yml any more. Decisions now happen in the
            # step above via --if-due, inside this same job. When the watchdog also dispatched one,
            # the next queued tick cancelled it - every decision run on 2026-09-10 was cancelled
            # that way, which is why the agent went a whole morning without thinking.
          else
            echo "market closed - idling, the chain stays awake so nothing has to wake it"
            sleep 600
            gh workflow run tick.yml --ref main -R "$GITHUB_REPOSITORY" && echo "next idle pass queued"
          fi
