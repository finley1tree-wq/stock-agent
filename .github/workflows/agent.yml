# Runs the agent every 30 minutes through the US trading day, Monday–Friday, with no server and no laptop.
# 13:00–21:59 UTC covers 9:00 AM–5:30 PM New York in both summer and winter; the agent exits in
# seconds when the market is closed, so the off-hours slots cost almost nothing.
# Slots sit at :02/:32 because GitHub delays cron jobs queued exactly on the hour and half hour;
# watchdog.yml fills in any slot GitHub drops. control.yml is the stop/start switch.
name: stock-agent
on:
  schedule:
    - cron: "2,32 13-21 * * 1-5"
  workflow_dispatch:
concurrency:
  group: stock-agent
  cancel-in-progress: false
permissions: { contents: write, actions: write }   # actions: write so it can restart the tick chain
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Start on the branch TIP at job start, not the sha recorded when the run was queued. A run
      # that waited in the concurrency lane used to begin one push behind its predecessor, which is
      # what produced every conflict-replay on 2026-09-10.
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      # A delivered cron slot is gated exactly like the chain's own decisions, so it cannot add a
      # second decision minutes after the tick's. Manual and control.yml dispatches stay immediate.
      - run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python -m agent.run --if-due 30; else python -m agent.run; fi
        env:
          BROKER: ${{ secrets.BROKER }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
      - name: commit results
        if: always()
        run: |
          # Commits must be authored by the GitHub account that owns the Vercel project (Hobby plan
          # blocks deploys from any other author on a private repo) or the dashboard stops updating.
          git config user.name finley1tree-wq
          git config user.email 284499650+finley1tree-wq@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "agent check $(date -u +%FT%H:%MZ)"
          # Two separate failures seen in production, both handled here.
          # 1. GitHub rejected a push with a server-side "fatal error in commit_refs" (2026-09-08)
          #    and threw the whole check away. A transient rejection is retried.
          # 2. A rebase hit a conflict, `|| true` swallowed it, and the runner was left mid-rebase
          #    on no branch, so everything after failed (2026-09-09). A conflict means someone else
          #    pushed while this run was computing, so this run's output is based on stale state:
          #    the safe move is to abort cleanly and let the next run redo the work from the new
          #    base, never to force a half-merged ledger through.
          for i in 1 2 3 4 5; do
            # The fetch is separated from the rebase on purpose: a transient network failure inside
            # 'git pull' used to land in the conflict branch and end in "nothing to replay; exit 0",
            # silently discarding the commit. Now a fetch failure just retries.
            if ! git fetch origin main; then echo "fetch attempt $i failed (network?), retrying"; sleep $((i * 5)); continue; fi
            if git rebase --autostash origin/main; then
              if git push; then echo "pushed on attempt $i"; exit 0; fi
              echo "push attempt $i rejected, retrying"; sleep $((i * 5))
            else
              git rebase --abort || true
              # If origin changed the LEDGER while this run was computing, this run's numbers are
              # based on a stale base and must not overwrite the newer truth (the owner's hand edit,
              # or another writer's fills). Discard; the next pass recomputes from the new base.
              # With every job starting on the branch tip (checkout ref: main + reset below) and the
              # lane serialising runs, this branch should almost never be reached.
              if [ -n "$(git log --oneline HEAD..origin/main -- portfolio.json state.json triggers.json journal.json decisions.json)" ]; then
                echo "the ledger moved under this run; discarding this run's output so the next one recomputes from the new base"
                git reset --hard origin/main; exit 0
              fi
              # Otherwise the conflict is only in the log or the published site data, and this
              # run's copy is the newer one. Replay it, keeping root and site sets SEPARATE - they
              # share filenames, and mixing them once restored a stale site copy over the ledger.
              echo "branch moved mid-run (log/site only); replaying this run's state on top of it"
              # Keep the two sets SEPARATE. They share filenames - portfolio.json exists at the
              # root and again under site/data - so copying both into one directory let the
              # published snapshot overwrite the live ledger and then get restored over it.
              rm -rf /tmp/keep && mkdir -p /tmp/keep/root /tmp/keep/site
              cp -f portfolio.json portfolio.md state.json log.md journal.json lessons.md \
                decisions.json triggers.json traders.json replay.json /tmp/keep/root/ 2>/dev/null || true
              cp -f site/data/. -r /tmp/keep/site/ 2>/dev/null || cp -f site/data/* /tmp/keep/site/ 2>/dev/null || true
              git reset --hard origin/main      # already fetched above
              cp -f /tmp/keep/root/. -r . 2>/dev/null || cp -f /tmp/keep/root/* . 2>/dev/null || true
              mkdir -p site/data && (cp -f /tmp/keep/site/. -r site/data/ 2>/dev/null || cp -f /tmp/keep/site/* site/data/ 2>/dev/null || true)
              git add -A
              if git diff --cached --quiet; then echo "nothing to replay"; exit 0; fi
              git commit -m "replay $(date -u +%FT%H:%MZ)" && git push && echo "replayed and pushed" && exit 0
              echo "replay attempt $i failed"; sleep $((i * 5))
            fi
          done
          echo "could not push after 5 attempts"; exit 1

      # A decision ends the tick chain (it took the lane), so it starts it again on the way out.
      - name: restart the tick chain
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          hour=$(date -u +%-H); dow=$(date -u +%u)
          if [ "$dow" -gt 5 ] || [ "$hour" -lt 13 ] || [ "$hour" -gt 20 ]; then
            echo "outside the session window; not restarting"; exit 0
          fi
          if python -c "
          import sys
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          from agent.broker_sim import is_trading_day, close_time
          n = datetime.now(ZoneInfo('America/New_York'))
          sys.exit(0 if (is_trading_day(n.date()) and time(9,30) <= n.time() < close_time(n.date())) else 1)
          "; then
            gh workflow run tick.yml --ref main -R "$GITHUB_REPOSITORY" && echo "tick chain restarted"
          else
            echo "market closed; chain stays down"
          fi
