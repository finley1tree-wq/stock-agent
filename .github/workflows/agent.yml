# Runs the agent every 30 minutes through the US trading day, Monday–Friday, with no server and no laptop.
# 13:00–21:59 UTC covers 9:00 AM–5:30 PM New York in both summer and winter; the agent exits in
# seconds when the market is closed, so the off-hours slots cost almost nothing.
# Slots sit at :02/:32 because GitHub delays cron jobs queued exactly on the hour and half hour;
# watchdog.yml fills in any slot GitHub drops. control.yml is the stop/start switch.
name: stock-agent
on:
  schedule:
    - cron: "2,32 13-21 * * 1-5"
  workflow_dispatch:
concurrency:
  group: stock-agent
  cancel-in-progress: false
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m agent.run
        env:
          BROKER: ${{ secrets.BROKER }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
      - name: commit results
        if: always()
        run: |
          # Commits must be authored by the GitHub account that owns the Vercel project (Hobby plan
          # blocks deploys from any other author on a private repo) or the dashboard stops updating.
          git config user.name finley1tree-wq
          git config user.email 284499650+finley1tree-wq@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "agent check $(date -u +%FT%H:%MZ)"
          git pull --rebase --autostash || true
          git push
