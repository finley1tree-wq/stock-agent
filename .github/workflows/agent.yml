# Runs the agent every 30 minutes through the US trading day, Monday–Friday, with no server and no laptop.
# 13:00–21:59 UTC covers 9:00 AM–5:30 PM New York in both summer and winter; the agent exits in
# seconds when the market is closed, so the off-hours slots cost almost nothing.
# Slots sit at :02/:32 because GitHub delays cron jobs queued exactly on the hour and half hour;
# watchdog.yml fills in any slot GitHub drops. control.yml is the stop/start switch.
name: stock-agent
on:
  schedule:
    - cron: "2,32 13-21 * * 1-5"
  workflow_dispatch:
concurrency:
  group: stock-agent
  cancel-in-progress: false
permissions: { contents: write, actions: write }   # actions: write so it can restart the tick chain
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m agent.run
        env:
          BROKER: ${{ secrets.BROKER }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
      - name: commit results
        if: always()
        run: |
          # Commits must be authored by the GitHub account that owns the Vercel project (Hobby plan
          # blocks deploys from any other author on a private repo) or the dashboard stops updating.
          git config user.name finley1tree-wq
          git config user.email 284499650+finley1tree-wq@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "agent check $(date -u +%FT%H:%MZ)"
          # Two separate failures seen in production, both handled here.
          # 1. GitHub rejected a push with a server-side "fatal error in commit_refs" (2026-09-08)
          #    and threw the whole check away. A transient rejection is retried.
          # 2. A rebase hit a conflict, `|| true` swallowed it, and the runner was left mid-rebase
          #    on no branch, so everything after failed (2026-09-09). A conflict means someone else
          #    pushed while this run was computing, so this run's output is based on stale state:
          #    the safe move is to abort cleanly and let the next run redo the work from the new
          #    base, never to force a half-merged ledger through.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash; then
              if git push; then echo "pushed on attempt $i"; exit 0; fi
              echo "push attempt $i rejected, retrying"; sleep $((i * 5))
            else
              # A conflict here is always in GENERATED state - the ledger, the log, the site data.
              # This run just re-read the ledger and recomputed all of it, so its version is the
              # newer truth; the other writer's is older data derived from the same files.
              # Discarding instead was throwing away every decision the agent made, all day: it
              # traded on every run and none of it ever persisted, which is why the dashboard
              # never changed. Our computed state wins, and only for these files.
              echo "branch moved mid-run; replaying this run's state on top of it"
              git rebase --abort || true
              mkdir -p /tmp/keep && cp -f portfolio.json portfolio.md state.json log.md journal.json \
                lessons.md decisions.json triggers.json traders.json replay.json /tmp/keep/ 2>/dev/null || true
              cp -f site/data/*.json site/data/*.md /tmp/keep/ 2>/dev/null || true
              git fetch origin main && git reset --hard origin/main
              cp -f /tmp/keep/portfolio.json /tmp/keep/portfolio.md /tmp/keep/state.json /tmp/keep/log.md \
                /tmp/keep/journal.json /tmp/keep/lessons.md /tmp/keep/decisions.json /tmp/keep/triggers.json \
                /tmp/keep/traders.json /tmp/keep/replay.json . 2>/dev/null || true
              mkdir -p site/data && cp -f /tmp/keep/*.json /tmp/keep/*.md site/data/ 2>/dev/null || true
              git checkout -- site/data/../../agent 2>/dev/null || true
              git add -A
              if git diff --cached --quiet; then echo "nothing to replay"; exit 0; fi
              git commit -m "replay $(date -u +%FT%H:%MZ)" && git push && echo "replayed and pushed" && exit 0
              echo "replay attempt $i failed"; sleep $((i * 5))
            fi
          done
          echo "could not push after 5 attempts"; exit 1

      # A decision ends the tick chain (it took the lane), so it starts it again on the way out.
      - name: restart the tick chain
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          hour=$(date -u +%-H); dow=$(date -u +%u)
          if [ "$dow" -gt 5 ] || [ "$hour" -lt 13 ] || [ "$hour" -gt 20 ]; then
            echo "outside the session window; not restarting"; exit 0
          fi
          if python -c "
          import sys
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          from agent.broker_sim import is_trading_day, close_time
          n = datetime.now(ZoneInfo('America/New_York'))
          sys.exit(0 if (is_trading_day(n.date()) and time(9,30) <= n.time() < close_time(n.date())) else 1)
          "; then
            gh workflow run tick.yml --ref main -R "$GITHUB_REPOSITORY" && echo "tick chain restarted"
          else
            echo "market closed; chain stays down"
          fi
