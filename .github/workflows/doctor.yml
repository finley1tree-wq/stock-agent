# Health check IN THE CLOUD, with the repository secrets: proves the keys GitHub holds actually work
# (Anthropic auth, prices, Congress/insider feeds, ledger, calendar) without trading or committing anything.
# Run it any time from github.com: Actions -> doctor -> Run workflow. Output is redacted.
name: doctor
on:
  workflow_dispatch:
permissions: { contents: read, actions: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m agent.doctor
        env:
          BROKER: ${{ secrets.BROKER }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
