# TEMPORARY DIAGNOSTIC (delete after use): proves whether GitHub's scheduler fires for this repo at all.
# Does nothing but print the time. Remove once the question is answered.
name: heartbeat
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: { contents: read }
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: date -u +"heartbeat %FT%H:%MZ event=$GITHUB_EVENT_NAME"
