# Weekly budget in USD. The agent may spend it across the week (Mon–Fri), deploying chunks
# when it thinks the timing is good. Whatever is left is deployed Friday afternoon so the
# week's money never sits idle.
weekly_budget: 25000

# Broker is chosen in .env (BROKER=sim | alpaca | ibkr). Default is sim: the built-in pretend-money
# portfolio, filled at real prices, buys AND sells, no brokerage account needed. This is the safety
# lock: run it for weeks and read portfolio.md before any real money is involved.
sim:
  starting_cash: 25000    # pretend dollars on day one
  weekly_deposit: 0       # no automatic Monday top-up: the account is a fixed $1000 and the returns
                          # are what it does with that. Set this if you want to add money weekly.

# How often the schedule calls the agent while the market is open (minutes). Informational:
# the brain is told how many checks it has left today so it paces itself. Must match agent.yml.
run_every_minutes: 30

# Guardrails — the brain can't override these.
guardrails:
  # Finley's plan, in two phases. This week: deploy what is justified and let the loop gather
  # evidence. From the date below: every dollar working, concentrated in the highest-conviction
  # names rather than spread thin - his words, "quality over quantity".
  full_deployment_from: "2026-09-14"    # the Monday
  full_deployment_max_names: 6          # was 3, which directly contradicted min_positions: 5
  rebuy_cooldown_minutes: 45            # re-entry allowed after this, instead of banned all day.
                                        # With a 30-minute clock an all-day ban retired every name
                                        # after one round trip and starved the book by lunchtime.
  max_per_ticker_pct: 100        # Finley's call: it may put the whole week's budget into ONE name.
                                 # The per-trade loss is still bounded by the stop (auto_bracket below),
                                 # so the risk this adds is concentration and overnight gap risk, not
                                 # an unbounded loss.
  max_per_sector_pct: 40         # of the weekly budget, per watchlist sector bucket (defense, gold, index,
                                 # real_estate, nuclear, widely_held). The sector map has always been in this
                                 # file and nothing enforced it: CCJ + NLR were $1,000 of a $1,500 book and
                                 # the same uranium bet, which is what turned an ordinary 30-minute drawdown
                                 # into most of one day's loss. Five names in one sector is one position.
  min_order_pct_of_budget: 0.4   # smallest order worth placing, as a % of the weekly budget.
                                 # Sizes are proportional so they cannot drift out of step with the
                                 # account again: a hard-coded number silently stopped working the
                                 # moment the account grew, and every order was dropped for a whole
                                 # morning of checks.
  min_order_usd: 100             # dollar floor; whichever of these two is larger wins
  max_entry_range_pct: 85        # Measured on 36,382 stock-days of this watchlist: the next-day edge
                                 # from buying low in the range is only 5-8 bps, about one round trip,
                                 # and the effect is threshold-shaped near 85 rather than linear at 60.
                                 # A market buy above this point in TODAY's range is chasing; it becomes a
                                 # resting limit instead. Day one averaged the 76th percentile and 6 of 7
                                 # entries closed red.
  chase_limit_at_pct: 55         # where to rest that limit. Measured over 1,224 fired cases: resting at
                                 # the 40th percentile filled only 39% of the time and LOST 0.128% per
                                 # signal, because a limit that fills is one the stock kept falling
                                 # through. Nothing from the 20th to the 55th beat just buying.
  max_daily_deploy_pct: 100      # the whole week's budget may go to work in a single day (tracked across the day's checks).
                                 # max_per_ticker_pct still forces it across at least 3 tickers, so 100% here means
                                 # fully invested, not all-in on one name.
  max_orders_per_day: 60         # a 30-minute hold means ~13 slots a day per position line; these caps
                                 # would otherwise become the real limit instead of the dollar caps
                                 # below are the real risk control, this only stops runaway churn
  friday_cleanup_after_et: "15:30"   # on Fridays from this time (New York) the whole remaining budget must be deployed
  only_buy: false                # false = the brain may sell positions (with evidence), true = buys only
  # Finley's rule: nothing is held longer than this, up or down. It forces the agent to take the
  # trade in front of it instead of waiting for a better one, and it generates far more completed
  # round trips - which is the point, because a closed trade is a graded trade.
  # The cost is real and worth knowing: every round trip pays about 4bp, so ten a day is ~0.4%/day
  # of pure friction before any decision is made. The 5-year replay found no measurable edge at a
  # one-DAY horizon, let alone thirty minutes, so treat what this produces as data collection.
  # Rest buy orders UNDER the market on names it does not own, so a dip is an ENTRY rather than
  # only an average-down into something already losing. Candidates need positive one-month
  # momentum AND to be in the lower part of today's range. Strong stock, weak day.
  # Status of that gate, honestly: one-month momentum is indistinguishable from luck at every horizon
  # the replay measured, and nothing has been measured at 30 minutes at all. It is kept because it is
  # cheap, explainable and graded (the dip_entry tag), not because it is proven.
  dip_hunt:
    enabled: true
    names: 6                     # how many resting dip orders to keep out at once
    dip_atr_mult: 0.75           # depth as a fraction of the move available in the hold window.
                                 # A flat 1.5% was reached in only 7.2% of 30-minute windows (2.8%
                                 # on META), which is why the orders sat all day and never filled.
    dip_floor_pct: 0.2           # never shallower than this
    good_for_days: 1             # a dip order sized for half an hour should not rest for a week
    below_pct: 1.5               # fallback when ATR is unavailable
    usd_pct_of_budget: 4.0       # size of each ($1,000 at a $25,000 budget)
  min_positions: 5               # aim to have at least this many names working at once

  max_hold_minutes: 30
  max_hold_days: 20              # measured on 5y of this watchlist, per trade after costs:
                                 #   2d +0.143%   5d +0.431%   10d +1.060%   20d +1.850%
                                 # The whole exit stack was destroying ~96% of what the entries were worth:
                                 # the live config returned +0.063%/trade against +1.850% for simply holding.
                                 # A 2-day stop was capping upside harder than the bracket was.
                                 # A position that has gone nowhere for this many days is closed regardless.
                                 # Capital sitting in a name that is not working is capital not working.
  time_stop_min_gain_pct: 1.0    # ...unless it is at least this far ahead, in which case let it run
  min_hold_days: 0               # 0 = it may exit the same day it bought, so a broken thesis or a hit target
                                 # is acted on now rather than two days later. Churn is held back instead by
                                 # max_orders_per_day / max_sells_per_day, the no-same-day-rebuy rule, and
                                 # spread_cost_pct below, which makes every round trip cost something.
  max_sells_per_day: 60          # must at least match the buys, or positions get stuck open
  allow_politician_tickers: true # may buy tickers Congress members recently bought, even if not on the watchlist
  politician_lookback_days: 30
  allow_insider_tickers: true    # may buy tickers with net insider (Form 4) buying, even if not on the watchlist
  insider_lookback_days: 30
  news_headlines_per_ticker: 3   # recent headlines pulled per allowed ticker (free, yfinance)
  max_drawdown_pct: 30           # circuit breaker: stop buying if equity falls this far below money put in
  max_daily_move_pct: 35         # ignore any quote that moved more than this in one day (bad tick / bad split)
  # Every position gets an exit plan the moment it exists, so a move is never watched round-trip
  # while waiting for the next check. The brain may place its own better levels; these fill the gaps.
  auto_bracket:
    enabled: true
    # Levels are sized in ATR - how far this stock actually moves on an ordinary day - because a
    # single percentage cannot fit both SPY (2.5% = 3.5 daily ranges, never reached) and OKLO
    # (2.5% = 0.39, hit by noise before lunch). The _pct values below are the fallback when ATR
    # is unavailable. Measured: fixed brackets cost 0.014pp/trade on SPY and 0.570pp on SOXL.
    # When max_hold_minutes is set the levels below are scaled to the move actually available in
    # that window (ATR x sqrt(minutes/390)). Measured: a 6x-ATR target was reached in 0.0% of
    # 30-minute windows, so the old daily levels could never fire inside the clock.
    #
    # This geometry MINIMISES THE BLEED. It does not create expectancy and cannot.
    # Measured on 112,298 real 30-minute windows across this watchlist: a bracket is a stopping
    # rule on a near-driftless process, so gross expectancy is ~0 and net is exactly minus
    # friction. A 50-cell grid of (target_mult, stop_mult) from 0.05/0.5 to 2.0/3.0 produced
    # ZERO positive cells; the range was -0.0316% to -0.0506% per trade. The levels below are
    # the least-bleed point that does not widen the tail: the worst single trade is unchanged.
    # To reach breakeven the ENTRY must deliver about +0.037pp of 30-minute alpha per trade.
    # Nothing in this repo has measured anything above noise at that horizon. Making money under
    # a 30-minute rule is an entry-selection problem, not an exit-geometry problem.
    intraday_target_mult: 0.4    # was 0.6; measured -0.0462% -> -0.0419%/trade, paired t=+7.5
    intraday_stop_mult: 1.0      # do NOT widen: every widening moved the worst-trade tail
    intraday_floor_pct: 0.15     # never place a level tighter than this; 0.05 measured as a no-op
                                 # that puts a resting sell inside the spread
    stop_loss_atr: 3.0           # (used when there is no intraday clock) stop at 3x the daily range. Measured over ~7,800 entries on 5y of
                                 # this watchlist, widening 2x -> 3x raised expectancy AND the win rate
                                 # (+1.118% -> +1.393% per trade, 48.1% -> 54.3%): a tight stop is mostly
                                 # a machine for getting shaken out of trades that were going to work.
    take_profit_atr: 6.0         # target at 6x, a 2:1 payoff against the wider stop. Every tightening of
                                 # the target measured WORSE: profit targets reduce expectancy monotonically.
    stop_floor_pct: 1.5          # never tighter than this, whatever ATR says
    stop_cap_pct: 12.0           # never wider than this
    take_profit_pct: 5.0         # sell part of the position this far above the AVERAGE COST, i.e. TWICE the
                                 # stop below. The old 2.5%
                                 # was smaller than the average watchlist stock's WHOLE DAY range (2.59%),
                                 # so it clipped winners before they could become winners.
    take_profit_size_pct: 33     # sell only a third at the target, so two thirds of a winner keeps running.
                                 # DAILY PATH ONLY. With max_hold_minutes set the code overrides this to 100:
                                 # there is nothing to let run when the clock closes the rest at market
                                 # minutes later, so a free limit fill was being turned into a paid one.
    stop_loss_pct: 2.5           # sell all of it this far below the average cost. Once the target above
                                 # has banked a partial win, this moves UP to the entry price, so the
                                 # remainder of a winning trade can no longer lose money.
    # Averaging in: buy again lower, and let the exit follow the blended average so the whole
    # position is closed as one once it turns green. This is the pattern in the trading videos.
    # The two limits below are what those videos do not have: a cap on how many times it may add,
    # and a real stop. Without both, the strategy wins small very often and then loses everything.
    scale_in:
      enabled: true
      max_tranches: 3            # the first buy plus at most two adds
      add_after_drop_pct: 3.0    # only add once it is this far below the current average cost
      add_pct_of_budget: 2.0     # each add is this % of the weekly budget, not a fixed dollar amount
      add_usd: 0                 # (unused when the percentage above is set)

  spread_cost_pct: 0.02          # every MARKET fill is this much worse than the quoted price (buys pay up,
                                 # sells receive less), so a round trip costs ~0.04% as it would in reality.
                                 # Standing limit orders are exempt: they fill at the level they asked for.
  trigger_slippage_pct: 0.05     # standing STOP orders become market orders when hit, so they fill this much
                                 # worse than their level. Limit orders fill at their level exactly.

# ---------------------------------------------------------------------------------------------
# MEMECOIN SLEEVE — a separate pretend $200, on its own ledger, with its own much tighter rules.
# It cannot spend the stock budget and a total loss here cannot touch the stock positions.
# Data: DexScreener (price/liquidity/volume), GeckoTerminal (candles), GoPlus + RugCheck (safety).
# No API keys. Nothing is ever bought on-chain: this is simulation at real prices, like the stocks.
memecoin:
  enabled: true
  weekly_budget: 200           # pretend dollars of NEW money per week, separate from the stocks
  starting_cash: 200
  weekly_deposit: 0            # one-time $200 to start; raise it only deliberately
  chain: solana
  max_per_token_pct: 15        # at most 15% of the sleeve in one token => $30
  max_positions: 5
  max_orders_per_day: 10
  max_sells_per_day: 10
  min_order_usd: 5
  spread_cost_pct: 0.75        # a DEX swap plus price impact costs far more than a stock trade
  take_profit_pct: 25          # these move in tens of percent, so the brackets are wider
  take_profit_size_pct: 50
  stop_loss_pct: 15
  max_drawdown_pct: 50         # stop buying if the sleeve halves
  # A token must clear EVERY one of these before the agent is even allowed to consider it.
  # Anything that cannot be verified is refused: on these chains, missing data is a red flag.
  screen:
    min_liquidity_usd: 75000
    min_volume24_usd: 50000
    min_pair_age_hours: 48     # nothing brand new; most rugs happen in the first two days
    max_volume_to_liquidity: 30
    min_txns24: 500
    max_top_holder_pct: 20     # one wallet holding more than this can exit on top of you
    min_holder_count: 800
    min_lp_locked_pct: 0       # RugCheck danger flags are the hard gate; lock % varies by design

# The first five sectors were hand-picked. The sixth was DISCOVERED: these are the names held
# most widely across disclosed congressional portfolios over the last year - each bought by at
# least three different members - after passing the instrument and liquidity screen. That is the
# point of reading other people's portfolios rather than guessing.
# Refresh it with:  python -m agent.discover
watchlist:
  defense:     [PLTR, LMT, RTX, NOC]
  gold:        [GLD, NEM]
  index:       [DIA, SPY]
  real_estate: [O, PLD, VNQ]
  nuclear:     [CCJ, OKLO, NLR]
  widely_held: [MSFT, AAPL, NVDA, GOOGL, AMZN, AMD, META, TSM, IBM, AVGO, UNH, HD]

# Traders to follow on-chain live in wallets.txt, NOT here - one address per line, editable
# straight from github.com so you can add one from your phone. There is nothing to connect: the
# agent reads that file on its next check. The list has no length limit; it visits a few wallets
# each pass and cycles through the rest, so 100 wallets come round about twice an hour.

# Politicians whose disclosed trades get extra weight (leave empty for all of Congress).
# Use names as they appear in disclosures, e.g. "Nancy Pelosi", "Josh Gottheimer".
followed_politicians: []

# Public figures to follow. Two things happen for each name:
#   1. their SEC Form 4 insider filings count 3x in insider buy pressure (only covers companies they're insiders of)
#   2. recent news about them is pulled and handed to the brain as context
# e.g. ["Elon Musk", "Jeff Bezos", "Warren Buffett"]. Leave empty to follow nobody in particular.
followed_people: []
